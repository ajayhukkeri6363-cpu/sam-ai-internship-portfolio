<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="30" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="150" y1="0" x2="150" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="350" y1="0" x2="350" y2="400" />
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
    <line x1="0" y1="250" x2="400" y2="250" />
    <line x1="0" y1="300" x2="400" y2="300" />
    <line x1="0" y1="350" x2="400" y2="350" />
  </g>

  <!-- Outer Glow Circle -->
  <circle cx="200" cy="180" r="110" fill="none" stroke="url(#avatarGrad)" stroke-width="3" stroke-dasharray="6,6" opacity="0.6" />

  <!-- Avatar Silhouette -->
  <!-- Head -->
  <circle cx="200" cy="150" r="55" fill="url(#avatarGrad)" filter="url(#glow)" />
  <!-- Body/Shoulders -->
  <path d="M 110 310 C 110 240, 150 225, 200 225 C 250 225, 290 240, 290 310 Z" fill="url(#avatarGrad)" filter="url(#glow)" />

  <!-- Code Elements -->
  <g font-family="'Fira Code', monospace" font-size="18" font-weight="bold" fill="#38bdf8">
    <text x="50" y="100">&lt;coder&gt;</text>
    <text x="270" y="320">&lt;/dev&gt;</text>
  </g>
</svg>
