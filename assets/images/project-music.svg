<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMusic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="musicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgMusic)" />

  <!-- Player Card -->
  <rect x="140" y="30" width="320" height="300" rx="20" fill="rgba(17, 24, 39, 0.85)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <!-- Album Art Disc -->
  <circle cx="300" cy="115" r="55" fill="#111827" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <circle cx="300" cy="115" r="48" fill="url(#discGrad)" filter="url(#musicGlow)" opacity="0.85" />
  <circle cx="300" cy="115" r="16" fill="#0f172a" />
  <circle cx="300" cy="115" r="6" fill="#f8fafc" />

  <!-- Track Info -->
  <text x="300" y="195" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Midnight City Vibes</text>
  <text x="300" y="213" fill="#9ca3af" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" text-anchor="middle">Aura Soundscapes</text>

  <!-- Progress Bar -->
  <rect x="175" y="232" width="250" height="5" rx="2.5" fill="#374151" />
  <rect x="175" y="232" width="145" height="5" rx="2.5" fill="#8b5cf6" />
  <circle cx="320" cy="234.5" r="6" fill="#c084fc" />

  <!-- Time Labels -->
  <text x="175" y="252" fill="#6b7280" font-family="'Fira Code', monospace" font-size="10">01:45</text>
  <text x="425" y="252" fill="#6b7280" font-family="'Fira Code', monospace" font-size="10" text-anchor="end">03:20</text>

  <!-- Control Buttons -->
  <!-- Prev -->
  <circle cx="230" cy="285" r="16" fill="#1f2937" />
  <path d="M 235 279 L 227 285 L 235 291 Z M 225 279 L 225 291" stroke="#cbd5e1" stroke-width="2" fill="#cbd5e1" />

  <!-- Play/Pause -->
  <circle cx="300" cy="285" r="22" fill="#8b5cf6" />
  <path d="M 296 277 L 308 285 L 296 293 Z" fill="#ffffff" />

  <!-- Next -->
  <circle cx="370" cy="285" r="16" fill="#1f2937" />
  <path d="M 365 279 L 373 285 L 365 291 Z M 375 279 L 375 291" stroke="#cbd5e1" stroke-width="2" fill="#cbd5e1" />
</svg>
